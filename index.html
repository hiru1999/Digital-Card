<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name - Digital Card</title>
  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    .card {
      background: white;
      display: inline-block;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
    }
    a {
      color: #007BFF;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Your Name</h1>
    <p>Graphic Designer</p>
    <p>📞 +94 76 123 4567</p>
    <p>📧 you@example.com</p>
    <p>🌐 <a href="https://yourwebsite.com">yourwebsite.com</a></p>
  </div>
</body>
</html>
